name: Market Place Data -> Supabase

# Incremental sync. Files are read from the same Google Drive folder as the
# local runs - Drive is the source in both cases. What differs is that a runner
# is thrown away afterwards, so the download cache does not survive. That is
# fine: the mp_loaded_files ledger means a run only fetches files it has never
# loaded, so a monthly sync pulls the new month, not the 5 GB back-history.
#
# The initial backfill is NOT run here. It moved ~22M rows over roughly two
# days, which does not fit in a job. Backfill locally once, then let this keep
# it current.

on:
  # STARTED BY THE DATABASE, not by this schedule: Supabase pg_cron job mp-sync-dispatch
  # (pg_cron_mp_sync_dispatch.sql) POSTs a workflow_dispatch every 4 hours -- 03:00, 07:00,
  # 11:00, 15:00, 19:00, 23:00 IST -- and the 15:00 one asks for the data-gaps mail.
  # GitHub honoured the old "30 5,9,12 UTC" schedule 4-6 hours late (first run of the day
  # 15:13-16:59 IST over 24-28 Oct 2026), so yesterday's sell-out reached mp_sales only after
  # Birbal's 13:30 IST sales-facts refresh and the boards ran two days behind. A dispatch
  # starts in seconds. Each run loads only files the ledger has not seen -- or that were
  # edited in Drive since we loaded them -- so a run costs a few minutes.
  schedule:
    # One fallback a day (18:00 IST, lands whenever GitHub gets to it) so the sync never
    # stops altogether if the dispatch token expires (http_status 401/403/404 in
    # public.mp_sync_dispatch_log). It does not send the gaps mail.
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Limit to source keys, space separated (blank = all)"
        required: false
        default: ""
      dry_run:
        description: "Parse only, write nothing"
        type: boolean
        default: false
      send_gaps_mail:
        description: "Also send the data-gaps mail after the sync"
        type: boolean
        default: false

# Never let two syncs overlap: they would fight over the same tables and each
# would re-download what the other is already fetching.
concurrency:
  group: marketplace-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330        # under the 6h job ceiling, with room to spare

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write credentials
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          # The OAuth refresh token works headlessly; no browser step is needed.
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json
          python -c "import json;json.load(open('token.json'));print('token.json parsed OK')"

      - name: Check connectivity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m mp.pipeline --check

      - name: Refresh the Drive index
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # index.json is not committed: new month folders appear constantly, so
        # it is rebuilt each run (~460 API calls, about two minutes).
        run: python -m mp.pipeline --refresh-index

      - name: Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Runners have ~14 GB free. Files are deleted as we go so a month of
          # Instamart (~350 MB each) cannot accumulate into a full disk.
          MP_KEEP_CACHE: "0"
          # After the load, retire the rows of files marketing trashed in Drive once a newer
          # file in the same folder has loaded the same campaign-day (mp/trashed.py). Rows with
          # no replacement are kept and listed in the gaps mail; files Drive cannot find are
          # only reported. Turned on by the owner 2026-10-04.
          MP_TRASHED_APPLY: "1"
          # The disk guard needs to reach Postgres directly - PostgREST cannot
          # report sizes. Same secrets the "Report table sizes" step uses.
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
        run: |
          ARGS=""
          for s in ${{ github.event.inputs.sources }}; do ARGS="$ARGS --source $s"; done
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # Deliberately no --reload: that would re-read all 3,619 files and
          # cannot finish inside a job.
          python -m mp.pipeline --run $ARGS

      - name: Email the data gaps (the 15:00 IST dispatch, or on request)
        # After the sync, so the mail describes what Supabase holds NOW. pg_cron passes
        # send_gaps_mail=true on its 15:00 IST dispatch only; the fallback schedule never mails.
        if: always() && github.event.inputs.send_gaps_mail == 'true'
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GAPS_MAIL_TO: harshil@thebakersdozen.in
        run: python -m mp.gaps_report --send

      - name: Report table sizes
        if: always()
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
        run: python -m mp.pipeline --sizes || echo "size report unavailable"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log
          path: |
            index.json
          retention-days: 14
