name: GL vs MIS sales reco -> Google Sheet

# Rewrites the "GL vs MIS Sales Reco (warehouse)" sheet, month by month, from
# public.mv_gl_sales_reco (python -m mp.gl_reco_sheet, see its docstring).
#
# The snapshot is rebuilt on the DATABASE's clock by pg_cron at 09:25 and 14:25
# IST (Birbal migration 078), after the o2c beat. GitHub starts scheduled runs
# late -- 4-5 hours in September 2026 -- so these fire as soon after the
# refresh as makes sense and off the hour; a late run still publishes the
# latest snapshot, it just publishes it later. Run it by hand (Actions tab)
# to publish immediately.

on:
  schedule:
    - cron: "43 4 * * *"    # 10:13 IST
    - cron: "43 9 * * *"    # 15:13 IST
  workflow_dispatch:

concurrency:
  group: gl-reco-sheet
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write credentials
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json
          python -c "import json;json.load(open('token.json'));print('token.json parsed OK')"

      - name: Publish the reco
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          GL_RECO_SHEET_ID: ${{ vars.GL_RECO_SHEET_ID }}
        run: python -m mp.gl_reco_sheet --run
